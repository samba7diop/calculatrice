<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculatrice</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f3a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9eef2;--body:#1f3a4d;--screen:#cfe3d4;--ink:#12301f;--dim:#4c6b57;--key:#f6f8fa;--kt:#1f3a4d;--ks:#b9c4cc;
--op:#2f6f8f;--os:#1d4a61;--sci:#5b6f7d;--ss:#34444f;--clr:#e07a3f;--cs:#9c4f22;--eq:#1f9d6b;--es:#146845;--pan:#16293a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171c;--body:#1a2832;--screen:#b7d3bd;--ink:#0f2619;--dim:#3f5e4a;--key:#2a3a46;--kt:#e8eef2;--ks:#0d1419;--op:#3c86a8;--sci:#4a5f6d;--pan:#101c26}}
:root[data-theme="dark"]{--bg:#10171c;--body:#1a2832;--screen:#b7d3bd;--ink:#0f2619;--dim:#3f5e4a;--key:#2a3a46;--kt:#e8eef2;--ks:#0d1419;--op:#3c86a8;--sci:#4a5f6d;--pan:#101c26}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.calc{position:relative;width:min(94vw,380px);background:var(--body);border-radius:22px;padding:16px;box-shadow:0 18px 40px rgba(0,0,0,.25);overflow:hidden}
.bar{display:flex;gap:8px;margin-bottom:10px}
.bar button{flex:1;font-size:.85rem;padding:8px 0;background:transparent;color:#cfe0ea;border:1px solid #4d6a7d;box-shadow:none;border-radius:10px}
.bar button.on{background:#cfe0ea;color:#1f3a4d}
.screen{background:var(--screen);border-radius:12px;padding:10px 14px;margin-bottom:14px;text-align:right;box-shadow:inset 0 3px 8px rgba(0,0,0,.25);min-height:80px;display:flex;flex-direction:column;justify-content:space-between}
.expr{font-size:1.05rem;color:var(--dim);min-height:1.4em;white-space:nowrap;overflow-x:auto}
.value{font-size:2.3rem;font-weight:600;color:var(--ink);white-space:nowrap;overflow-x:auto;font-variant-numeric:tabular-nums}
.keys,.sci{display:grid;gap:9px}
.keys{grid-template-columns:repeat(4,1fr)}
.sci{grid-template-columns:repeat(5,1fr);margin-bottom:9px;display:none}
.sci.show{display:grid}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:9px}
.mem button{font-size:.9rem;padding:8px 0;background:var(--sci);color:#fff;box-shadow:0 4px 0 var(--ss)}
.mem button.has{outline:2px solid #ffd166}
button{font:inherit;font-size:1.25rem;font-weight:600;border:0;border-radius:12px;padding:13px 0;cursor:pointer;background:var(--key);color:var(--kt);box-shadow:0 4px 0 var(--ks)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ks)}
button:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
.sci button{font-size:.95rem;padding:10px 0;background:var(--sci);color:#fff;box-shadow:0 4px 0 var(--ss)}
.op{background:var(--op);color:#fff;box-shadow:0 4px 0 var(--os)}
.clr{background:var(--clr);color:#fff;box-shadow:0 4px 0 var(--cs)}
.eq{background:var(--eq);color:#fff;box-shadow:0 4px 0 var(--es)}
.zero{grid-column:span 2}
.hist{position:absolute;inset:0;background:var(--pan);color:#e8eef2;padding:16px;display:none;flex-direction:column;z-index:2}
.hist.show{display:flex}
.hist h2{margin:0 0 10px;font-size:1.1rem}
.list{flex:1;overflow-y:auto}
.item{display:block;width:100%;text-align:right;background:transparent;color:#e8eef2;box-shadow:none;border-bottom:1px solid #2c4254;border-radius:0;padding:10px 4px;font-size:1rem;font-weight:400}
.item b{display:block;font-size:1.3rem}
.empty{color:#8fa6b5;text-align:center;margin-top:30px}
.hb{display:flex;gap:8px;margin-top:10px}
.hb button{flex:1;font-size:.95rem;padding:10px 0;box-shadow:none}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
</head>
<body>
<main class="calc">
  <div class="bar">
    <button id="bSci" aria-pressed="false">Scientifique</button>
    <button id="bAng" class="on" aria-label="Unité d'angle">DEG</button>
    <button id="bHist">Historique</button>
  </div>
  <div class="screen" aria-live="polite"><div class="expr" id="expr"></div><div class="value" id="val">0</div></div>
  <div class="sci" id="sci">
    <button data-t="sin(">sin</button><button data-t="cos(">cos</button><button data-t="tan(">tan</button><button data-t="ln(">ln</button><button data-t="log(">log</button>
    <button data-t="√(">√</button><button data-t="^2">x²</button><button data-t="^">xʸ</button><button data-t="^(-1)">1/x</button><button data-t="!">n!</button>
    <button data-t="π">π</button><button data-t="e">e</button><button data-t="(">(</button><button data-t=")">)</button><button data-a="neg">±</button>
    <button data-t="asin(">sin⁻¹</button><button data-t="acos(">cos⁻¹</button><button data-t="atan(">tan⁻¹</button><button data-t="10^">10ˣ</button><button data-t="e^">eˣ</button>
  </div>
  <div class="mem">
    <button data-a="mc" id="bMC">MC</button><button data-a="mr" id="bMR">MR</button><button data-a="mp">M+</button><button data-a="mm">M−</button>
  </div>
  <div class="keys" id="keys">
    <button class="clr" data-a="clear">C</button><button class="op" data-a="back" aria-label="Effacer">⌫</button><button class="op" data-t="%">%</button><button class="op" data-t="÷">÷</button>
    <button data-t="7">7</button><button data-t="8">8</button><button data-t="9">9</button><button class="op" data-t="×">×</button>
    <button data-t="4">4</button><button data-t="5">5</button><button data-t="6">6</button><button class="op" data-t="−">−</button>
    <button data-t="1">1</button><button data-t="2">2</button><button data-t="3">3</button><button class="op" data-t="+">+</button>
    <button class="zero" data-t="0">0</button><button data-t=",">,</button><button class="eq" data-a="eq">=</button>
  </div>
  <section class="hist" id="hist" aria-label="Historique">
    <h2>Historique</h2><div class="list" id="list"></div>
    <div class="hb"><button id="hClear">Vider</button><button id="hClose" class="op">Fermer</button></div>
  </section>
</main>
<script>
(function(){
var ex="",res="",done=false,deg=true,hist=[],mem=0;
function updMem(){var b=document.getElementById("bMR");if(b)b.classList.toggle("has",mem!==0)}
var $=function(i){return document.getElementById(i)};
try{hist=JSON.parse(localStorage.getItem("calc-hist")||"[]")}catch(e){hist=[]}
function save(){try{localStorage.setItem("calc-hist",JSON.stringify(hist.slice(0,50)))}catch(e){}}
function fmt(n){if(typeof n==="string")return n;if(!isFinite(n))return "Erreur";var s=String(parseFloat(n.toPrecision(12)));return s.replace(".",",").replace("-","−")}
// ---- analyseur ----
function evaluate(src){
  var s=src.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/,/g,".");
  var open=(s.match(/\(/g)||[]).length-(s.match(/\)/g)||[]).length;
  while(open-->0)s+=")";
  var re=/\d+(?:\.\d+)?|\.\d+|asin|acos|atan|sin|cos|tan|ln|log|√|π|e|[+\-*\/^%!()]/y,t=[],m;
  re.lastIndex=0;
  while(re.lastIndex<s.length){m=re.exec(s);if(!m)throw 0;t.push(m[0])}
  var p=0;
  function pk(){return t[p]}
  function isNum(x){return x!==undefined&&/^[\d.]/.test(x)}
  function startsVal(x){return x!==undefined&&(isNum(x)||x==="("||x==="π"||x==="e"||/^(asin|acos|atan|sin|cos|tan|ln|log|√)$/.test(x))}
  function expr(){var v=term();while(pk()==="+"||pk()==="-"){var o=t[p++],r=term();v=o==="+"?v+r:v-r}return v}
  function term(){var v=unary();for(;;){if(pk()==="*"||pk()==="/"){var o=t[p++],r=unary();if(o==="/"&&r===0)throw 0;v=o==="*"?v*r:v/r}else if(startsVal(pk())){v*=unary()}else break}return v}
  function unary(){if(pk()==="-"){p++;return -unary()}if(pk()==="+"){p++;return unary()}return pow()}
  function pow(){var b=post();if(pk()==="^"){p++;return Math.pow(b,unary())}return b}
  function post(){var v=prim();for(;;){if(pk()==="%"){p++;v/=100}else if(pk()==="!"){p++;v=fact(v)}else break}return v}
  function fact(n){if(n<0||n>170||n!==Math.floor(n))throw 0;var r=1;for(var i=2;i<=n;i++)r*=i;return r}
  function prim(){
    var x=t[p++];
    if(x===undefined)throw 0;
    if(isNum(x))return parseFloat(x);
    if(x==="π")return Math.PI;
    if(x==="e")return Math.E;
    if(x==="("){var v=expr();if(t[p++]!==")")throw 0;return v}
    if(/^(asin|acos|atan|sin|cos|tan|ln|log|√)$/.test(x)){
      var a=prim();
      var k=deg?Math.PI/180:1;
      if(x==="sin")return Math.abs(a*k%Math.PI)<1e-12?0:Math.sin(a*k);
      if(x==="cos")return Math.abs((a*k-Math.PI/2)%Math.PI)<1e-12?0:Math.cos(a*k);
      if(x==="tan"){if(Math.abs((a*k-Math.PI/2)%Math.PI)<1e-12)throw 0;return Math.abs(a*k%Math.PI)<1e-12?0:Math.tan(a*k)}
      if(x==="asin"||x==="acos"){if(a<-1||a>1)throw 0;var r1=x==="asin"?Math.asin(a):Math.acos(a);return deg?r1*180/Math.PI:r1}
      if(x==="atan"){var r2=Math.atan(a);return deg?r2*180/Math.PI:r2}
      if(x==="ln"){if(a<=0)throw 0;return Math.log(a)}
      if(x==="log"){if(a<=0)throw 0;return Math.log10(a)}
      if(a<0)throw 0;return Math.sqrt(a);
    }
    throw 0;
  }
  var v=expr();if(p<t.length)throw 0;
  if(!isFinite(v)||isNaN(v))throw 0;
  return v;
}
function preview(){
  res="";
  if(ex){try{var v=evaluate(ex);res=fmt(v)}catch(e){res=""}}
}
function draw(){
  $("expr").textContent=ex;
  $("val").textContent=res||(ex?"…":"0");
}
function add(tx){
  if(done){
    if(/^[\d,π(]|^(asin|acos|atan|sin|cos|tan|ln|log|√|e)/.test(tx)&&!/^[%!^]/.test(tx)){ex=""}
    else ex=res.replace("Erreur","");
    done=false;
  }
  if(tx===","){var m=ex.match(/[\d,]*$/)[0];if(m.indexOf(",")>=0)return;if(m==="")tx="0,"}
  ex+=tx;
}
function back(){if(done){ex="";done=false;return}ex=ex.replace(/(asin\(|acos\(|atan\(|sin\(|cos\(|tan\(|ln\(|log\(|√\(|.)$/,"")}
function neg(){
  if(done){ex=res;done=false}
  var m=ex.match(/(^|[+−×÷(^])(−?)([\d,]*)$/);
  if(m&&m[3]!==""){var i=ex.length-m[2].length-m[3].length;ex=m[2]?ex.slice(0,i-0).slice(0,ex.length-m[3].length-1)+m[3]:ex.slice(0,i)+"−"+m[3]}
  else ex+="−";
}
function eq(){
  if(!ex)return;
  try{var v=evaluate(ex);var r=fmt(v);hist.unshift({e:ex,r:r});save();ex=ex;res=r;done=true;renderHist()}
  catch(e){res="Erreur";done=true}
}
function renderHist(){
  var l=$("list");l.innerHTML="";
  if(!hist.length){var d=document.createElement("div");d.className="empty";d.textContent="Aucun calcul pour l'instant.";l.appendChild(d);return}
  hist.forEach(function(h){
    var b=document.createElement("button");b.className="item";
    var s=document.createElement("span");s.textContent=h.e+" =";
    var r=document.createElement("b");r.textContent=h.r;
    b.appendChild(s);b.appendChild(r);
    b.onclick=function(){ex=h.r.replace("−","−");res="";done=false;preview();draw();$("hist").classList.remove("show")};
    l.appendChild(b);
  });
}
function handle(a,tx){
  if(tx!==undefined&&tx!==null){add(tx)}
  else if(a==="clear"){ex="";res="";done=false}
  else if(a==="back")back();
  else if(a==="neg")neg();
  else if(a==="mc"){mem=0;updMem();return}
  else if(a==="mr"){add(mem<0?"("+fmt(mem)+")":fmt(mem))}
  else if(a==="mp"||a==="mm"){try{var mv=ex?evaluate(ex):0;mem+=a==="mp"?mv:-mv;mem=parseFloat(mem.toPrecision(12));updMem()}catch(er){}return}
  else if(a==="eq"){eq();draw();return}
  if(!done)preview();
  draw();
}
document.querySelector(".calc").addEventListener("click",function(e){
  var b=e.target.closest("button[data-a],button[data-t]");if(!b)return;
  handle(b.dataset.a,b.dataset.t);
});
$("bSci").onclick=function(){var on=$("sci").classList.toggle("show");this.classList.toggle("on",on);this.setAttribute("aria-pressed",on);try{localStorage.setItem("calc-sci",on?"1":"0")}catch(e){}};
$("bAng").onclick=function(){deg=!deg;this.textContent=deg?"DEG":"RAD";this.classList.toggle("on",deg);if(!done)preview();draw()};
$("bHist").onclick=function(){renderHist();$("hist").classList.add("show")};
$("hClose").onclick=function(){$("hist").classList.remove("show")};
$("hClear").onclick=function(){hist=[];save();renderHist()};
document.addEventListener("keydown",function(e){
  if($("hist").classList.contains("show")){if(e.key==="Escape")$("hist").classList.remove("show");return}
  var k=e.key,map={"*":"×","/":"÷","-":"−","+":"+","(":"(",")":")","^":"^","%":"%","!":"!",".":",",",":","};
  if(/^[0-9]$/.test(k))handle(null,k);
  else if(map[k]){e.preventDefault();handle(null,map[k])}
  else if(k==="Enter"||k==="="){e.preventDefault();handle("eq")}
  else if(k==="Backspace")handle("back");
  else if(k==="Escape"||k==="Delete")handle("clear");
  else if(k==="p")handle(null,"π");
  else return;
});
try{if(localStorage.getItem("calc-sci")==="1")$("bSci").click()}catch(e){}
renderHist();draw();
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
